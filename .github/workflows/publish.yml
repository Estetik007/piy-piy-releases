name: Publish piy-piy 0.1.9

on:
  push:
    branches: [release-publish-v0.1.9]
    paths: ['release-files/**']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release files
        working-directory: release-files
        run: sha256sum -c SHA256SUMS.txt
      - name: Upload files and publish the release
        working-directory: release-files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v0.1.9 channel.json SHA256SUMS.txt piy-piy-0.1.9-x64.zip piy-piy-setup-0.1.9-x64.exe news-1.jpg --repo "$GITHUB_REPOSITORY"
          gh release edit v0.1.9 --draft=false --latest --repo "$GITHUB_REPOSITORY"
